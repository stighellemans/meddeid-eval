[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meddeid-eval"
version = "0.2.2"
description = "Canonical metrics and stability analysis for MedDeID"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Stig Hellemans"}]
keywords = ["de-identification", "clinical-nlp", "evaluation", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["meddeid-core>=0.1.0", "meddeid-language-nl>=0.1.0", "PyYAML>=6"]

[project.urls]
Homepage = "https://stighellemans.github.io/meddeid.github.io/"
Documentation = "https://stighellemans.github.io/meddeid.github.io/workflows/train-and-evaluate/"
Source = "https://github.com/stighellemans/meddeid-eval"
Issues = "https://github.com/stighellemans/meddeid-eval/issues"
"MedDeID on Hugging Face" = "https://huggingface.co/collections/stighellemans/meddeid"

[project.optional-dependencies]
infer = ["meddeid>=0.1.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
meddeid-eval = "meddeid_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
